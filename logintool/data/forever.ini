; WoW Forever narration settings. The tool writes them into the client's
; WTF\Config.wtf at start-up while the client is closed; the client reads them
; when it starts.
;
; Without a line here the client gets the tool's own settings: the voice
; picked in the tool's setup and the tool's speech rate (5).
;
; voice=<number> picks another voice: its position in the Windows voice list,
; counting from 0. Optional:
; rate=<-10..10>    speech rate, 0 = normal, higher = faster
; volume=<0..100>
;
; The client narrates each text only once per run through the SAPI2SR bridge;
; repeats stay silent (its speech cache keeps no audio for the bridge). So when
; the client stays silent after a hover, the tool says the item itself (on the
; ruleset cards with the whole description): on by default with the bridge,
; off with a real voice. repeatecho=1 or repeatecho=0 overrides that.
; echo=1 makes the tool speak each target name itself (debug aid).
echo=0
