; WoW Forever narration voice for the client (accessibilityScreenNarrationVoice).
; The number is the client TTS voice ID as C_VoiceChat.GetTtsVoices() lists it,
; 0 = a real voice through the speakers (repeats are replayed from the client
; cache and stay audible), 1 = the NVDA bridge on this machine (repeats go silent).
; NOT the position in the Windows voice list. Optional: rate=, volume=.
voice=0
; echo=1 makes the tool speak each target name itself (debug aid).
echo=0
; repeatecho=0 switches off the tool echo on repeated hovers (only with a bridge that is not cached).
repeatecho=0
; speech rate of the narration voice (client scale, 0 = normal, higher = faster).
rate=5
